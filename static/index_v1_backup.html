<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMS Lab — Robot Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap');

  :root {
    --bg: #0d0f12;
    --bg2: #13161b;
    --bg3: #1a1e25;
    --border: #2a2f3a;
    --accent: #4af0a8;
    --accent2: #378ADD;
    --danger: #f04a4a;
    --warn: #f0a84a;
    --text: #e8eaf0;
    --text2: #7a8196;
    --text3: #4a5068;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* 상단 바 */
  .topbar {
    height: 52px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .logo span { color: var(--text2); }
  .conn-status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text2);
  }
  .conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text3);
    transition: background 0.3s;
  }
  .conn-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .conn-dot.error { background: var(--danger); }

  /* 메인 레이아웃 */
  .main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 0;
    flex: 1;
    overflow: hidden;
  }

  /* 왼쪽 패널 */
  .left {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  /* 지도 */
  .map-section {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .map-area {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    min-height: 260px;
  }

  /* 그리드 라인 */
  .map-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
  }

  .zone {
    position: absolute;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg3);
    transition: all 0.2s;
    user-select: none;
  }
  .zone:hover { border-color: var(--accent2); background: #1a2535; transform: scale(1.03); }
  .zone.active { border-color: var(--accent); background: #0d2018; box-shadow: 0 0 12px rgba(74,240,168,0.15); }
  .zone.navigating { animation: pulse-zone 1s infinite; }
  @keyframes pulse-zone { 0%,100% { box-shadow: 0 0 8px rgba(74,240,168,0.2); } 50% { box-shadow: 0 0 20px rgba(74,240,168,0.5); } }

  .zone-id { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--text); }
  .zone-name { font-size: 10px; color: var(--text2); margin-top: 2px; }
  .zone.active .zone-id { color: var(--accent); }

  /* 로봇 마커 */
  .robot-marker {
    position: absolute;
    width: 20px; height: 20px;
    transform: translate(-50%, -50%);
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
  }
  .robot-marker::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--accent2);
    border: 2px solid white;
  }
  .robot-marker::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 1px solid var(--accent2);
    opacity: 0.4;
    animation: sonar 2s infinite;
  }
  @keyframes sonar { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(2); opacity: 0; } }

  /* 버튼 패널 */
  .btn-panel {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .ctrl-btn {
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--accent2); background: #1a2535; }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.danger { border-color: #3a1a1a; color: var(--danger); }
  .ctrl-btn.danger:hover { border-color: var(--danger); background: #1a0d0d; }
  .ctrl-btn .btn-icon { font-size: 14px; width: 16px; text-align: center; }

  /* 오른쪽 채팅 패널 */
  .right {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .chat-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 1px;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.6;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent2);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg.bot .bubble {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.system .bubble {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 11px;
    align-self: center;
    border-radius: 4px;
  }
  .msg-time { font-size: 10px; color: var(--text3); font-family: var(--mono); }

  /* 명령 미리보기 카드 */
  .cmd-preview {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-self: stretch;
  }
  .cmd-preview-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 1px;
  }
  .cmd-list { display: flex; flex-direction: column; gap: 4px; }
  .cmd-item {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    padding: 4px 8px;
    background: #0d2018;
    border-radius: 4px;
    border-left: 2px solid var(--accent);
  }
  .cmd-actions { display: flex; gap: 6px; margin-top: 4px; }
  .cmd-btn {
    flex: 1;
    padding: 7px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text);
    font-size: 12px;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
  }
  .cmd-btn.confirm { border-color: var(--accent); color: var(--accent); }
  .cmd-btn.confirm:hover { background: #0d2018; }
  .cmd-btn.cancel { color: var(--text2); }
  .cmd-btn.cancel:hover { border-color: var(--danger); color: var(--danger); }

  /* 상태 카드 */
  .status-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 6px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    line-height: 1.8;
    align-self: stretch;
  }
  .status-card .status-title { color: var(--accent); font-size: 10px; letter-spacing: 1px; margin-bottom: 6px; }

  /* 타이핑 인디케이터 */
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); animation: typing 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-4px); opacity: 1; } }

  /* 입력창 */
  .chat-input-area {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text);
    font-family: var(--sans);
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    min-height: 42px;
    max-height: 100px;
  }
  .chat-input:focus { border-color: var(--accent2); }
  .chat-input::placeholder { color: var(--text3); }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 8px;
    background: var(--accent2);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 16px;
  }
  .send-btn:hover { background: #4a9be8; }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--bg3); cursor: not-allowed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">HMS<span>LAB</span></div>
  <div style="width:1px; height:20px; background:var(--border);"></div>
  <div style="font-size:11px; color:var(--text2); font-family:var(--mono);">ROBOT CONTROL INTERFACE</div>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">연결 중...</span>
  </div>
</div>

<div class="main">
  <div class="left">
    <div class="map-section">
      <div class="section-label">실험실 지도</div>
      <div class="map-area" id="mapArea">
        <div class="zone" id="zA" style="left:6%;top:8%;width:26%;height:36%;" onclick="zoneClick('A')">
          <span class="zone-id">A</span><span class="zone-name">입구</span>
        </div>
        <div class="zone" id="zB" style="left:37%;top:8%;width:26%;height:36%;" onclick="zoneClick('B')">
          <span class="zone-id">B</span><span class="zone-name">실험실</span>
        </div>
        <div class="zone" id="zC" style="left:68%;top:8%;width:26%;height:36%;" onclick="zoneClick('C')">
          <span class="zone-id">C</span><span class="zone-name">보관소</span>
        </div>
        <div class="zone" id="zD" style="left:6%;top:56%;width:26%;height:36%;" onclick="zoneClick('D')">
          <span class="zone-id">D</span><span class="zone-name">충전소</span>
        </div>
        <div class="zone" id="zE" style="left:37%;top:56%;width:26%;height:36%;" onclick="zoneClick('E')">
          <span class="zone-id">E</span><span class="zone-name">회의실</span>
        </div>
        <div class="zone" id="zF" style="left:68%;top:56%;width:26%;height:36%;" onclick="zoneClick('F')">
          <span class="zone-id">F</span><span class="zone-name">출구</span>
        </div>
        <div class="robot-marker" id="robotMarker" style="left:50%;top:50%;"></div>
      </div>
    </div>

    <div class="btn-panel">
      <button class="ctrl-btn danger" onclick="quickCmd('stop()', '긴급 정지')">
        <span class="btn-icon">⏹</span> 긴급 정지
      </button>
      <button class="ctrl-btn" onclick="quickCmd('return_to_base()', '기지 복귀')">
        <span class="btn-icon">🏠</span> 기지 복귀
      </button>
      <button class="ctrl-btn" onclick="quickCmd('report_status()', '상태 보고')">
        <span class="btn-icon">📊</span> 상태 보고
      </button>
      <button class="ctrl-btn" onclick="quickCmd('scan_area()', '구역 스캔')">
        <span class="btn-icon">🔍</span> 구역 스캔
      </button>
      <button class="ctrl-btn" onclick="quickCmd('take_photo()', '사진 촬영')">
        <span class="btn-icon">📷</span> 사진 촬영
      </button>
      <button class="ctrl-btn" onclick="quickCmd('charge()', '충전 시작')">
        <span class="btn-icon">🔋</span> 충전 시작
      </button>
    </div>
  </div>

  <div class="right">
    <div class="chat-header">
      <div style="width:6px;height:6px;border-radius:50%;background:var(--accent);"></div>
      <span class="chat-header-title">COMMAND CHANNEL</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="msg system">
        <div class="bubble">시스템 초기화 완료 — 명령을 입력하세요</div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" placeholder="로봇에게 명령을 내려주세요..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<script>
const zonePos = {
  A: { left: '19%', top: '26%' },
  B: { left: '50%', top: '26%' },
  C: { left: '81%', top: '26%' },
  D: { left: '19%', top: '74%' },
  E: { left: '50%', top: '74%' },
  F: { left: '81%', top: '74%' },
};

let ws = null;
let currentZone = null;
let pendingCommands = [];
let isWaiting = false;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('connDot').className = 'conn-dot connected';
    document.getElementById('connLabel').textContent = '연결됨';
  };

  ws.onclose = () => {
    document.getElementById('connDot').className = 'conn-dot error';
    document.getElementById('connLabel').textContent = '연결 끊김';
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    document.getElementById('connDot').className = 'conn-dot error';
    document.getElementById('connLabel').textContent = '연결 오류';
  };

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    handleServerMessage(data);
  };
}

function handleServerMessage(data) {
  removeTyping();
  setWaiting(false);

  if (data.type === 'chat') {
    addBotMsg(data.text);
  } else if (data.type === 'converting') {
    showTyping();
    setWaiting(true);
  } else if (data.type === 'commands') {
    pendingCommands = data.commands;
    showCommandPreview(data.commands);
  } else if (data.type === 'executing') {
    showTyping();
    setWaiting(true);
  } else if (data.type === 'result') {
    handleResult(data);
  } else if (data.type === 'error') {
    addBotMsg('⚠ ' + data.text);
  } else if (data.type === 'cancelled') {
    addSystemMsg('명령이 취소됐습니다');
  }
}

function handleResult(data) {
  if (data.success) {
    let text = `✅ ${data.message}`;
    addBotMsg(text);

    // 상태 보고가 있으면 카드로 표시
    if (data.status_report) {
      showStatusCard(data.status_report);
    }

    // navigate_to 명령이 있으면 지도에 반영
    data.executed.forEach(cmd => {
      const match = cmd.match(/navigate_to\('([A-F])'\)/);
      if (match) moveRobot(match[1]);
    });
  } else {
    addBotMsg('❌ ' + data.message);
  }
}

function showStatusCard(report) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';

  const parts = report.split(' ');
  const lines = parts.map(p => {
    const [k, v] = p.split(':');
    return `<div><span style="color:var(--text3)">${k}</span>  <span style="color:var(--text)">${v}</span></div>`;
  }).join('');

  div.innerHTML = `
    <div class="status-card">
      <div class="status-title">— 로봇 상태 보고 —</div>
      ${lines}
    </div>
    <span class="msg-time">${now()}</span>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showCommandPreview(commands) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'cmdPreview';

  const items = commands.map((c, i) =>
    `<div class="cmd-item">${i+1}. ${c}</div>`
  ).join('');

  div.innerHTML = `
    <div class="cmd-preview">
      <div class="cmd-preview-title">— 실행 예정 명령어 —</div>
      <div class="cmd-list">${items}</div>
      <div class="cmd-actions">
        <button class="cmd-btn confirm" onclick="confirmCmd()">✓ 실행</button>
        <button class="cmd-btn cancel" onclick="cancelCmd()">✕ 취소</button>
      </div>
    </div>
    <span class="msg-time">${now()}</span>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function confirmCmd() {
  const preview = document.getElementById('cmdPreview');
  if (preview) preview.remove();
  addUserMsg('실행');
  showTyping();
  setWaiting(true);
  ws.send(JSON.stringify({ type: 'confirm' }));
}

function cancelCmd() {
  const preview = document.getElementById('cmdPreview');
  if (preview) preview.remove();
  ws.send(JSON.stringify({ type: 'cancel' }));
}

function zoneClick(zone) {
  addUserMsg(`${zone}구역으로 이동해줘`);
  showTyping();
  setWaiting(true);
  ws.send(JSON.stringify({ type: 'message', text: `${zone}구역으로 이동해줘` }));
}

function quickCmd(cmd, label) {
  addUserMsg(label);
  showTyping();
  setWaiting(true);
  ws.send(JSON.stringify({ type: 'quick_cmd', cmd: cmd }));
}

function moveRobot(zone) {
  if (currentZone) document.getElementById('z' + currentZone).classList.remove('active');
  currentZone = zone;
  document.getElementById('z' + zone).classList.add('active');
  const pos = zonePos[zone];
  const marker = document.getElementById('robotMarker');
  marker.style.left = pos.left;
  marker.style.top = pos.top;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isWaiting || !ws || ws.readyState !== 1) return;
  addUserMsg(text);
  input.value = '';
  input.style.height = 'auto';
  showTyping();
  setWaiting(true);
  ws.send(JSON.stringify({ type: 'message', text }));
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function addUserMsg(text) {
  addMsg(text, 'user');
}

function addBotMsg(text) {
  addMsg(text, 'bot');
}

function addSystemMsg(text) {
  addMsg(text, 'system');
}

function addMsg(text, type) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = `<div class="bubble">${text}</div><span class="msg-time">${now()}</span>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  removeTyping();
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingIndicator');
  if (t) t.remove();
}

function setWaiting(v) {
